<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan interactif</title>

<style>

body{
    margin:0;
    padding:20px;
    font-family:Arial, sans-serif;
    background:#1e1e2f;
    color:white;
}

h2{
    text-align:center;
    margin-bottom:20px;
}

/* LAYOUT */

.container{
    display:flex;
    gap:20px;
    align-items:flex-start;
}

/* SCHEMA */

#canvas{
    flex:2;
    background:black;
    border:2px solid #444;
    border-radius:10px;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:10px;
}

#img{
    width:100%;
    max-width:1100px;
    height:auto;
    border-radius:5px;
}

/* TABLE */

.table-container{
    flex:1;
    max-height:90vh;
    overflow-y:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    color:black;
    border-radius:10px;
    overflow:hidden;
}

th, td{
    border-bottom:1px solid #ddd;
    padding:8px;
    vertical-align:top;
}

th{
    background:#4facfe;
    color:white;
    position:sticky;
    top:0;
}

td[contenteditable="true"]{
    background:#f5f5f5;
}

/* SOUS-LEGENDES */

.sublegend{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.sublegend-item{
    display:flex;
    gap:5px;
    align-items:center;
}

.sublegend-item input{
    flex:1;
    padding:5px;
}

/* SELECT */

select{
    padding:4px;
    border-radius:5px;
}

/* BOUTONS */

button{
    border:none;
    border-radius:5px;
    padding:5px 8px;
    cursor:pointer;
}

.add-sub{
    margin-top:5px;
    font-size:12px;
}

/* STATUTS */

.status-todo{
    background:#ffd6d6;
}

.status-progress{
    background:#fff3cd;
}

.status-done{
    background:#d4edda;
}

/* DELETE BUTTON */

.delete-btn{
    background:#ff4d4d;
    color:white;
}

/* RESPONSIVE */

@media (max-width:1200px){
    .container{
        flex-direction:column;
    }

    .table-container{
        width:100%;
        max-height:none;
    }
}

</style>
</head>

<body>

<h2>🧠 Plan interactif</h2>

<div class="container">

    <!-- SCHEMA -->
    <div id="canvas">
        <img id="img" src="schema.png">
    </div>

    <!-- TABLE -->
    <div class="table-container">

        <table>

            <thead>
                <tr>
                    <th>#</th>
                    <th>Légende</th>
                    <th>Sous-légendes</th>
                </tr>
            </thead>

            <tbody id="tableBody"></tbody>

        </table>

    </div>

</div>

<script>

/* =========================
   LEGENDES FIXES
========================= */

const legends = [
    "Salle des clubs",
    "Réserve sono",
    "Réserve bar",
    "Arrière bar",
    "Bar",
    "réserve des futs vides",
    "G",
    "Salle sono",
    "Fumette",
    "Salle des tables et des palettes",
    "Antichambre",
    "Salle du cercle",
    "Toilettes fille",
    "Toilettes mec",
    "Toilettes non binaires",
    "fosse",
    "autre"
];

const tableBody =
    document.getElementById("tableBody");

/* =========================
   GENERATION TABLE
========================= */

legends.forEach((legend, index) => {

    const id = index + 1;

    const row =
        document.createElement("tr");

    row.innerHTML = `

        <td>${id}</td>

        <td contenteditable="true">
            ${legend}
        </td>

        <td>

            <div class="sublegend"
                 id="sub-${id}">

                ${createSublegend()}

            </div>

            <button class="add-sub"
                    onclick="addSub(${id})">

                + sous-légende

            </button>

        </td>

    `;

    tableBody.appendChild(row);
});

/* =========================
   CREATE SUBLEGEND
========================= */

function createSublegend(text = "Sous-légende"){

    return `

        <div class="sublegend-item">

            <input type="text" value="${text}">

            <select onchange="updateStatus(this)">

                <option value="todo">À faire</option>
                <option value="progress">En cours</option>
                <option value="done">Fini</option>

            </select>

            <button class="delete-btn"
                    onclick="deleteSub(this)">
                ✕
            </button>

        </div>

    `;
}

/* =========================
   ADD SUBLEGEND
========================= */

function addSub(id){

    const container =
        document.getElementById("sub-" + id);

    const div =
        document.createElement("div");

    div.innerHTML =
        createSublegend("Nouvelle sous-légende");

    container.appendChild(
        div.firstElementChild
    );
}

/* =========================
   DELETE SUBLEGEND
========================= */

function deleteSub(btn){

    btn.parentElement.remove();

}

/* =========================
   STATUS UPDATE
========================= */

function updateStatus(select){

    const item =
        select.parentElement;

    item.classList.remove(
        "status-todo",
        "status-progress",
        "status-done"
    );

    if(select.value === "todo"){
        item.classList.add("status-todo");
    }

    if(select.value === "progress"){
        item.classList.add("status-progress");
    }

    if(select.value === "done"){
        item.classList.add("status-done");
    }
}

</script>

</body>
</html>
